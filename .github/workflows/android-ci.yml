name: Android CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-apk:
    name: Tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_USER_HOME: ${{ runner.temp }}/inkcalendar-android-user
      EXPECTED_DEBUG_CERT_SHA256: 6abe0b1fb9a54c235449098445e5a63053f67e8606cf309816d38313fb6fa72f
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;34.0.0"

      - name: Select debug signing
        id: signing
        shell: bash
        env:
          # Pull requests never receive the existing private signing key.
          DEBUG_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.INK_CALENDAR_DEBUG_KEYSTORE_BASE64 || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_USER_HOME"
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_USER_HOME/debug.keystore"
            actual=$(keytool -exportcert -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
            if [[ "$actual" != "$EXPECTED_DEBUG_CERT_SHA256" ]]; then
              echo "::error::The stored keystore does not match the existing InkCalendar debug certificate."
              exit 1
            fi
            mode=existing-debug
          else
            mode=ephemeral-debug
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "APK signing mode: $mode" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$mode" == ephemeral-debug ]]; then
            echo "This CI APK has a temporary debug key and cannot be assumed to update an existing installation." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run tests, lint and assemble APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK and record checksum
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          APK_PATH=app/build/outputs/apk/debug/app-debug.apk
          REPORT_PATH=app/build/outputs/apk/debug/signing.txt
          sha256sum "$APK_PATH" > "$APK_PATH.sha256"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK_PATH" | tee "$REPORT_PATH"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$REPORT_PATH")
          if [[ "$SIGNING_MODE" == existing-debug && "$actual" != "$EXPECTED_DEBUG_CERT_SHA256" ]]; then
            echo "::error::The APK did not use the restored signing certificate."
            exit 1
          fi
          printf '\nSigning mode: %s\nCommit: %s\n' "$SIGNING_MODE" "$GITHUB_SHA" >> "$REPORT_PATH"
          printf '\nAPK SHA-256:\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$APK_PATH.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Android-reports-${{ github.run_number }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            delivery/host-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: InkCalendar-${{ steps.signing.outputs.mode }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/output-metadata.json
            app/build/outputs/apk/debug/signing.txt
          if-no-files-found: error
          retention-days: 14
